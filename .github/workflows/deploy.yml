# Публикация на GitHub Pages (страница организации balls-rolling.github.io).
#
# Сайт живёт в корне домена, поэтому `base` в vite.config.ts менять не нужно.
# Для project page (репозиторий с другим именем) понадобился бы base: '/<repo>/'.
#
# Тесты здесь намеренно не запускаются: известный флейк `tic-tac/brain.test.ts`
# иногда краснеет и блокировал бы публикацию. Проверки — локально.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
